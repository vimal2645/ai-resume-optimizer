name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to prevent Streamlit 12-hour inactivity sleep
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Streamlit App
        run: curl -s https://vpixcel-ai-resume-scanner.streamlit.app/ > /dev/null
